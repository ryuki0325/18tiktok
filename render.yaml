# Render のブループリント：Webサービス（Next.js）と PostgreSQL をまとめて作る
# 使い方：Render → New → Blueprint → このリポジトリを選ぶ（README の「公開する」を参照）
services:
  - type: web
    name: glow
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /age-gate
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: glow-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO
        value: "true"
      - key: CRON_SECRET
        generateValue: true

databases:
  - name: glow-db
    plan: free
    region: singapore
    databaseName: glow
