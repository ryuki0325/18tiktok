# Render のブループリント：Webサービス（Next.js）と PostgreSQL をまとめて作る
# 使い方：Render → New → Blueprint → このリポジトリを選ぶ（README の「公開する」を参照）
services:
  - type: web
    name: glow
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /age-gate
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: glow-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO
        value: "true"
      - key: CRON_SECRET
        generateValue: true
      # 動画の保存・配信（Bunny Stream）。3つとも入れると投稿画面で動画をアップロードできるようになる
      - key: BUNNY_STREAM_LIBRARY_ID
        sync: false
      - key: BUNNY_STREAM_API_KEY
        sync: false
      - key: BUNNY_STREAM_CDN_HOST
        sync: false
      # Bunny の Webhook にかける鍵。Bunny 側の Webhook URL の末尾に ?t=（この値）を付ける
      - key: BUNNY_WEBHOOK_SECRET
        generateValue: true
      # 通知メール（Resend）。3つとも入れると、審査結果や措置の知らせがメールでも届く
      - key: MAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # メールのリンクに使う自分のURL（例：https://vybe.example）
      - key: APP_URL
        sync: false

databases:
  - name: glow-db
    plan: free
    region: singapore
    databaseName: glow
